# pnpm 11 的 settings 载体（单包项目也用它；package.json 的 pnpm 字段已被忽略）。
# adapter 7.10.0 自带依赖 better-sqlite3 ^12.6.0，12.x 无随包二进制、--ignore-scripts
# 下是空壳（服务器 seed 即炸于此）；统一到 13.0.3 与项目直接依赖同版本。
# 注意 13.x 也不是开箱即用：prebuilds/linux-x64.node 要求 GLIBC_2.33，服务器
# （Alibaba Cloud Linux 3，glibc 2.32）须源码编译，见 deploy.sh 的编译步骤。
# 本文件必须随发布包上传（deploy.sh 组装步骤），否则服务器 pnpm install 因缺
# settings 重新解析，override 失效。
overrides:
  "@prisma/adapter-better-sqlite3>better-sqlite3": ^13.0.3
